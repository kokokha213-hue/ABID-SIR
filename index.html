<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ABID SIR · Premium Gaming</title>
    <meta name="description" content="ABID SIR – premium gaming hub. Exclusive files, monthly membership 2000 PKR, secure access, gaming updates.">
    <meta name="keywords" content="ABID SIR, gaming, premium, files, membership, PKR, updates">
    <link rel="canonical" href="https://abidsir.gaming">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        /* ============================================================
           COMPLETE LOGIN/LANDING PAGE UPGRADE
           ============================================================ */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0c12;
            color: #e3e9f0;
            min-height: 100vh;
            font-family: 'Exo 2', 'Segoe UI', sans-serif;
            overflow-x: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ============================================================
           ANIMATED BACKGROUND
           ============================================================ */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .bg-gradient {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(0, 100, 200, 0.08), transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(100, 0, 200, 0.06), transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(0, 200, 255, 0.04), transparent 50%);
            pointer-events: none;
            animation: gradientPulse 8s ease-in-out infinite;
        }
        @keyframes gradientPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .neon-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            animation: floatOrb 8s ease-in-out infinite;
        }
        .neon-orb:nth-child(1) {
            width: 300px;
            height: 300px;
            background: rgba(0, 200, 255, 0.08);
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }
        .neon-orb:nth-child(2) {
            width: 400px;
            height: 400px;
            background: rgba(120, 0, 255, 0.06);
            bottom: -150px;
            left: -150px;
            animation-delay: 3s;
        }
        .neon-orb:nth-child(3) {
            width: 250px;
            height: 250px;
            background: rgba(0, 255, 200, 0.05);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 6s;
        }

        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.5; }
            25% { transform: translate(30px, -30px) scale(1.1); opacity: 0.7; }
            50% { transform: translate(-20px, 20px) scale(0.9); opacity: 0.4; }
            75% { transform: translate(15px, 15px) scale(1.05); opacity: 0.6; }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0c12; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #00ccff, #0066aa); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #00ccff; }

        /* ============================================================
           LOGIN OVERLAY
           ============================================================ */
        #passwordOverlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(8, 11, 18, 0.92);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s ease, visibility 0.6s;
            padding: 1rem;
        }
        #passwordOverlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .login-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            position: relative;
            z-index: 1;
        }

        /* ============================================================
           ANNOUNCEMENT BAR - UPGRADED
           ============================================================ */
        .announcement-bar {
            background: rgba(13, 28, 43, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 1.2rem;
            padding: 0.7rem 1.2rem;
            border: 1px solid rgba(0, 183, 255, 0.15);
            box-shadow: 0 0 40px rgba(0, 56, 101, 0.1), inset 0 0 40px rgba(0, 183, 255, 0.03);
            display: flex;
            align-items: center;
            gap: 0.8rem;
            overflow: hidden;
            animation: fadeInDown 0.8s ease;
            position: relative;
        }
        .announcement-bar::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 183, 255, 0.2), transparent);
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .announcement-bar .live-badge {
            background: #ff0040;
            color: white;
            padding: 0.15rem 0.8rem;
            border-radius: 40px;
            font-size: 0.55rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: pulseLive 1.5s ease-in-out infinite;
            flex-shrink: 0;
            box-shadow: 0 0 20px rgba(255, 0, 64, 0.2);
        }
        @keyframes pulseLive {
            0%, 100% { opacity: 1; box-shadow: 0 0 20px rgba(255, 0, 64, 0.3); }
            50% { opacity: 0.7; box-shadow: 0 0 40px rgba(255, 0, 64, 0.5); }
        }

        .announcement-bar .announce-icon {
            color: #00e0ff;
            font-size: 1rem;
            flex-shrink: 0;
            animation: iconPulse 2s ease-in-out infinite;
        }
        @keyframes iconPulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        .announcement-bar .announce-wrapper {
            flex: 1;
            overflow: hidden;
            position: relative;
            height: 24px;
            display: flex;
            align-items: center;
        }

        .announcement-bar .announce-track {
            display: flex;
            white-space: nowrap;
            animation: scrollAnnounce 25s linear infinite;
        }
        .announcement-bar .announce-track span {
            padding: 0 2rem;
            color: #c2defa;
            font-weight: 500;
            font-size: 0.85rem;
            flex-shrink: 0;
        }
        .announcement-bar .announce-track span strong {
            color: #ffd966;
            font-weight: 600;
        }
        @keyframes scrollAnnounce {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* ============================================================
           FEATURE TAGS - UPGRADED PREMIUM BADGES
           ============================================================ */
        .feature-tags {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.6rem;
            animation: fadeInUp 0.8s ease 0.15s both;
        }

        .feature-tag {
            background: rgba(15, 26, 43, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 1rem;
            padding: 0.6rem 0.4rem;
            border: 1px solid rgba(31, 74, 107, 0.2);
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: default;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.2rem;
        }
        .feature-tag:hover {
            transform: translateY(-3px) scale(1.03);
            border-color: rgba(0, 204, 255, 0.4);
            box-shadow: 0 0 30px rgba(0, 204, 255, 0.08), 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        .feature-tag .icon {
            font-size: 1.1rem;
            margin-bottom: 0.1rem;
        }
        .feature-tag .icon.shield { color: #4ade80; }
        .feature-tag .icon.ban { color: #f87171; }
        .feature-tag .icon.update { color: #60a5fa; }
        .feature-tag .icon.price { color: #fbbf24; }

        .feature-tag .label {
            font-size: 0.6rem;
            font-weight: 600;
            color: #b8d0e5;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .feature-tag .value {
            font-size: 0.7rem;
            font-weight: 700;
            color: #ddf4ff;
        }
        .feature-tag .value.price-text {
            color: #fbbf24;
            font-size: 0.75rem;
        }

        .feature-tag:hover .icon.shield { color: #6ade90; text-shadow: 0 0 30px rgba(74, 222, 128, 0.3); }
        .feature-tag:hover .icon.ban { color: #f89898; text-shadow: 0 0 30px rgba(248, 113, 113, 0.3); }
        .feature-tag:hover .icon.update { color: #80b8ff; text-shadow: 0 0 30px rgba(96, 165, 250, 0.3); }
        .feature-tag:hover .icon.price { color: #fcd34d; text-shadow: 0 0 30px rgba(251, 191, 36, 0.3); }

        /* ============================================================
           LOGIN CARD - UPGRADED PREMIUM
           ============================================================ */
        .login-box {
            background: rgba(15, 26, 43, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 2.5rem 2.5rem 2rem;
            border-radius: 2.5rem;
            border: 1px solid rgba(0, 102, 170, 0.2);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5), 0 0 60px rgba(0, 50, 100, 0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: floatCard 6s ease-in-out infinite;
            transition: all 0.3s;
        }
        @keyframes floatCard {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .login-box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(0, 200, 255, 0.04), transparent, rgba(100, 0, 255, 0.04), transparent);
            animation: rotateGlow 20s linear infinite;
            pointer-events: none;
        }
        @keyframes rotateGlow {
            to { transform: rotate(360deg); }
        }

        /* Card glow border */
        .login-box::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 2.5rem;
            padding: 1px;
            background: linear-gradient(135deg, rgba(0, 200, 255, 0.1), transparent 40%, transparent 60%, rgba(100, 0, 255, 0.1));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .login-box>* { position: relative; z-index: 1; }

        /* ===== LOGO ===== */
        .login-box .logo-icon {
            font-size: 3.8rem;
            color: #00ccff;
            margin-bottom: 0.2rem;
            position: relative;
            display: inline-block;
            animation: logoGlow 3s ease-in-out infinite;
        }
        @keyframes logoGlow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(0, 204, 255, 0.2)); }
            50% { filter: drop-shadow(0 0 60px rgba(0, 204, 255, 0.5)); }
        }

        .login-box .logo-icon::after {
            content: '';
            position: absolute;
            inset: -30px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 204, 255, 0.08), transparent 70%);
            animation: logoBgPulse 3s ease-in-out infinite;
            z-index: -1;
        }
        @keyframes logoBgPulse {
            0%, 100% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
        }

        .login-box h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(145deg, #a0f0ff, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
            text-shadow: 0 0 40px rgba(0, 180, 255, 0.15);
        }
        .login-box .subtitle {
            color: #6a8fa8;
            font-size: 0.7rem;
            margin-bottom: 1.5rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 300;
        }

        /* ===== INPUT FIELDS ===== */
        .login-box .input-group {
            position: relative;
            margin-bottom: 1rem;
        }
        .login-box .input-group i {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: #3a6a8a;
            font-size: 1rem;
            transition: all 0.4s;
            z-index: 2;
        }
        .login-box .input-group input {
            width: 100%;
            padding: 0.85rem 1.2rem 0.85rem 3rem;
            background: rgba(1, 10, 20, 0.6);
            border: 1px solid rgba(31, 74, 107, 0.3);
            border-radius: 60px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.4s;
            font-family: 'Exo 2', sans-serif;
        }
        .login-box .input-group input::placeholder {
            color: #3a5a7a;
        }
        .login-box .input-group input:focus {
            border-color: #00a6ff;
            box-shadow: 0 0 30px rgba(0, 119, 255, 0.15), inset 0 0 30px rgba(0, 119, 255, 0.02);
            background: rgba(1, 10, 20, 0.8);
        }
        .login-box .input-group input:focus+i {
            color: #00ccff;
        }

        .login-box .input-group .toggle-pass {
            position: absolute;
            right: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: #3a6a8a;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s;
            z-index: 2;
            background: transparent;
            border: none;
            padding: 0.3rem;
        }
        .login-box .input-group .toggle-pass:hover {
            color: #00ccff;
        }

        /* ===== LOGIN BUTTON ===== */
        .login-box .btn {
            background: linear-gradient(145deg, #005f9e, #0077cc);
            border: none;
            padding: 0.9rem;
            border-radius: 60px;
            font-weight: 700;
            color: white;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            border: 1px solid rgba(0, 136, 208, 0.2);
            box-shadow: 0 0 40px rgba(0, 76, 128, 0.15);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            letter-spacing: 2px;
            font-family: 'Exo 2', sans-serif;
            position: relative;
            overflow: hidden;
            margin-top: 0.3rem;
        }
        .login-box .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            transition: 0.6s;
        }
        .login-box .btn:hover::before {
            left: 100%;
        }
        .login-box .btn:hover {
            background: linear-gradient(145deg, #0077cc, #0099ee);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 60px rgba(0, 102, 204, 0.4), 0 10px 40px rgba(0, 76, 128, 0.2);
        }
        .login-box .btn:active {
            transform: scale(0.96);
            box-shadow: 0 0 30px rgba(0, 102, 204, 0.2);
        }
        .login-box .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== DIVIDER ===== */
        .login-divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.2rem 0 1rem;
            color: #2a4a6a;
            font-size: 0.7rem;
        }
        .login-divider::before,
        .login-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(31, 74, 107, 0.3), transparent);
        }

        /* ===== FOOTER TEXT ===== */
        .login-footer-text {
            color: #3a6a8a;
            font-size: 0.7rem;
            margin-top: 0.5rem;
            opacity: 0.7;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        .login-footer-text i {
            color: #00ccff;
        }
        .login-footer-text a {
            color: #25d366;
            text-decoration: none;
            transition: 0.3s;
        }
        .login-footer-text a:hover {
            opacity: 0.8;
        }

        .loader-ring {
            display: inline-block;
            width: 30px;
            height: 30px;
            margin: 0.3rem auto;
            border: 3px solid rgba(26, 56, 80, 0.3);
            border-top: 3px solid #00ccff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .login-box .error-msg {
            color: #ff6b6b;
            margin-top: 0.6rem;
            font-weight: 500;
            min-height: 1.5rem;
            font-size: 0.85rem;
        }
        .login-box .success-msg {
            color: #4ade80;
            margin-top: 0.6rem;
            font-weight: 500;
            min-height: 1.5rem;
            font-size: 0.85rem;
        }

        /* ============================================================
           MAIN APP (UNCHANGED)
           ============================================================ */
        .glass-container {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            background: rgba(10, 14, 23, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 2.5rem;
            padding: 1.8rem 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 180, 255, 0.08);
            border: 1px solid rgba(0, 180, 255, 0.1);
            position: relative;
            z-index: 1;
            display: none;
        }
        .glass-container.visible {
            display: block;
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-loading {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: rgba(8, 11, 18, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
        }
        .auth-loading.hidden { display: none; }
        .auth-loading .loader-ring { width: 50px; height: 50px; border-width: 4px; }
        .auth-loading p {
            color: #6a8fa8;
            font-size: 0.9rem;
            letter-spacing: 3px;
            animation: pulseText 1.5s ease-in-out infinite;
        }
        @keyframes pulseText {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 700px) {
            .login-box { padding: 2rem 1.5rem 1.5rem; border-radius: 2rem; }
            .login-box .logo-icon { font-size: 3rem; }
            .login-box h2 { font-size: 1.6rem; }
            .feature-tags { grid-template-columns: repeat(2, 1fr); gap: 0.5rem; }
            .feature-tag { padding: 0.5rem 0.3rem; border-radius: 0.8rem; }
            .feature-tag .icon { font-size: 0.9rem; }
            .feature-tag .label { font-size: 0.5rem; }
            .feature-tag .value { font-size: 0.6rem; }
            .announcement-bar { padding: 0.5rem 0.8rem; border-radius: 1rem; }
            .announcement-bar .announce-track span { font-size: 0.75rem; padding: 0 1rem; }
            .login-container { max-width: 100%; }
        }
        @media (max-width: 480px) {
            .login-box { padding: 1.5rem 1rem 1.2rem; }
            .login-box .logo-icon { font-size: 2.5rem; }
            .login-box h2 { font-size: 1.3rem; letter-spacing: 1px; }
            .login-box .subtitle { font-size: 0.6rem; letter-spacing: 2px; }
            .login-box .input-group input { padding: 0.7rem 1rem 0.7rem 2.5rem; font-size: 0.85rem; }
            .login-box .input-group i { left: 0.8rem; font-size: 0.85rem; }
            .feature-tags { grid-template-columns: 1fr 1fr; gap: 0.4rem; }
            .feature-tag .icon { font-size: 0.8rem; }
            .feature-tag .label { font-size: 0.45rem; }
            .feature-tag .value { font-size: 0.55rem; }
            .login-footer-text { font-size: 0.6rem; gap: 0.4rem; }
            .announcement-bar .announce-track span { font-size: 0.65rem; }
            .announcement-bar .live-badge { font-size: 0.45rem; padding: 0.1rem 0.5rem; }
        }
    </style>
</head>
<body>

    <!-- ===== BACKGROUND EFFECTS ===== -->
    <div class="bg-gradient"></div>
    <div class="neon-orb"></div>
    <div class="neon-orb"></div>
    <div class="neon-orb"></div>
    <canvas id="particles-canvas"></canvas>

    <!-- ===== AUTH LOADING ===== -->
    <div class="auth-loading" id="authLoading">
        <div class="loader-ring"></div>
        <p>🔐 LOADING SECURE VAULT...</p>
    </div>

    <!-- ===== LOGIN OVERLAY ===== -->
    <div id="passwordOverlay">
        <div class="login-container">

            <!-- ===== ANNOUNCEMENT BAR ===== -->
            <div class="announcement-bar">
                <span class="live-badge">● LIVE</span>
                <i class="fas fa-bullhorn announce-icon"></i>
                <div class="announce-wrapper">
                    <div class="announce-track" id="announceTrack">
                        <span><strong>📢</strong> Loading announcements...</span>
                    </div>
                </div>
            </div>

            <!-- ===== FEATURE TAGS ===== -->
            <div class="feature-tags">
                <div class="feature-tag">
                    <i class="fas fa-shield-alt icon shield"></i>
                    <span class="label">Status</span>
                    <span class="value">Fully Safe</span>
                </div>
                <div class="feature-tag">
                    <i class="fas fa-ban icon ban"></i>
                    <span class="label">Protection</span>
                    <span class="value">AntiBan</span>
                </div>

                    <i class="fas fa-sync-alt icon update"></i>

    <script>
        // ============================================================
        // PARTICLES BACKGROUND
        // ============================================================
        (function initParticles() {
            const canvas = document.getElementById('particles-canvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            let w, h;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Particle {
                constructor() {
                    this.x = Math.random() * w;
                    this.y = Math.random() * h;
                    this.size = Math.random() * 2 + 0.5;
                    this.speedX = (Math.random() - 0.5) * 0.4;
                    this.speedY = (Math.random() - 0.5) * 0.4;
                    this.opacity = Math.random() * 0.5 + 0.1;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.x < 0 || this.x > w) this.speedX *= -1;
                    if (this.y < 0 || this.y > h) this.speedY *= -1;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 200, 255, ${this.opacity})`;
                    ctx.fill();
                }
            }

            for (let i = 0; i < 80; i++) {
                particles.push(new Particle());
            }

            function animate() {
                ctx.clearRect(0, 0, w, h);
                particles.forEach(p => { p.update(); p.draw(); });
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 120) {
                            ctx.beginPath();
                            ctx.strokeStyle = `rgba(0, 200, 255, ${0.05 * (1 - dist / 120)})`;
                            ctx.lineWidth = 0.5;
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(animate);
            }
            animate();
        })();
