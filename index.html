<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ABID SIR · Premium Gaming</title>
    <meta name="description" content="ABID SIR – premium gaming hub. Exclusive files, monthly membership 2000 PKR, secure access, gaming updates.">
    <meta name="keywords" content="ABID SIR, gaming, premium, files, membership, PKR, updates">
    <link rel="canonical" href="https://abidsir.gaming">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        /* ============================================================
           PREMIUM UI - VISUAL UPGRADE ONLY
           All functionality remains UNCHANGED
           ============================================================ */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #05080f;
            color: #e3e9f0;
            min-height: 100vh;
            font-family: 'Exo 2', 'Segoe UI', sans-serif;
            overflow-x: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        /* ============================================================
           PREMIUM ANIMATED BACKGROUND
           ============================================================ */
        #bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-deep-space {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse at 20% 30%, rgba(0, 50, 100, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(50, 0, 100, 0.10) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(0, 100, 200, 0.05) 0%, transparent 70%),
                linear-gradient(180deg, #05080f 0%, #080c1a 40%, #0a1025 70%, #060810 100%);
            animation: deepPulse 8s ease-in-out infinite;
        }
        @keyframes deepPulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        .grid-lines {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0, 200, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 200, 255, 0.015) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 30s linear infinite;
            opacity: 0.4;
        }
        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .energy-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            animation: orbFloat 15s ease-in-out infinite;
            opacity: 0.3;
        }
        .energy-orb.orb-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 150, 255, 0.10), rgba(0, 100, 200, 0.02));
            top: -150px;
            right: -100px;
            animation-delay: 0s;
        }
        .energy-orb.orb-2 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(100, 0, 255, 0.08), rgba(50, 0, 150, 0.02));
            bottom: -120px;
            left: -80px;
            animation-delay: 5s;
        }
        .energy-orb.orb-3 {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(0, 255, 200, 0.06), rgba(0, 150, 150, 0.02));
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 10s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.2; }
            25% { transform: translate(50px, -30px) scale(1.1); opacity: 0.4; }
            50% { transform: translate(-20px, 40px) scale(0.9); opacity: 0.3; }
            75% { transform: translate(30px, 20px) scale(1.05); opacity: 0.4; }
        }

        .light-streak-container {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }
        .light-streak {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 200, 255, 0.12), rgba(0, 200, 255, 0.25), rgba(0, 200, 255, 0.12), transparent);
            filter: blur(1px);
            animation: streakMove 12s linear infinite;
            width: 100%;
        }
        .light-streak:nth-child(1) { top: 15%; animation-delay: 0s; }
        .light-streak:nth-child(2) { top: 35%; animation-delay: 3s; width: 80%; left: 10%; }
        .light-streak:nth-child(3) { top: 55%; animation-delay: 6s; width: 90%; left: 5%; }
        .light-streak:nth-child(4) { top: 75%; animation-delay: 9s; width: 70%; left: 15%; }
        .light-streak:nth-child(5) { top: 90%; animation-delay: 2s; width: 85%; left: 8%; }

        @keyframes streakMove {
            0% { transform: translateX(-100%) scaleX(0.5); opacity: 0; }
            10% { opacity: 0.3; }
            50% { transform: translateX(0%) scaleX(1); opacity: 0.6; }
            90% { opacity: 0.3; }
            100% { transform: translateX(100%) scaleX(0.5); opacity: 0; }
        }

        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.5) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* ============================================================
           PARTICLES - SUBTLE
           ============================================================ */
        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .glass-atmosphere {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse at 30% 40%, rgba(0, 150, 255, 0.02) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(100, 0, 255, 0.015) 0%, transparent 40%);
            backdrop-filter: blur(1px);
            -webkit-backdrop-filter: blur(1px);
            pointer-events: none;
            z-index: 2;
        }

        /* ============================================================
           LOGIN CONTAINER
           ============================================================ */
        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        /* ============================================================
           ANNOUNCEMENT BAR - UPGRADED VISUAL
           ============================================================ */
        .announcement-bar {
            background: rgba(13, 28, 43, 0.55);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 60px;
            padding: 0.7rem 1.5rem;
            border: 1px solid rgba(0, 183, 255, 0.08);
            box-shadow: 0 0 40px rgba(0, 56, 101, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.02);
            display: flex;
            align-items: center;
            gap: 0.8rem;
            animation: slideDown 0.8s ease;
            position: relative;
            overflow: hidden;
        }
        .announcement-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 200, 255, 0.03), transparent);
            animation: shimmer 4s ease-in-out infinite;
        }
        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .announcement-bar .live-badge {
            background: linear-gradient(135deg, #ff0040, #cc0033);
            color: white;
            padding: 0.15rem 0.8rem;
            border-radius: 40px;
            font-size: 0.55rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: pulseLive 1.8s ease-in-out infinite;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
            box-shadow: 0 0 20px rgba(255, 0, 64, 0.20);
        }
        @keyframes pulseLive {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 0, 64, 0.20); }
            50% { box-shadow: 0 0 40px rgba(255, 0, 64, 0.40); }
        }

        .announcement-bar .announce-icon {
            color: #00e0ff;
            font-size: 1rem;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }
        .announcement-bar .announce-text {
            color: #c2defa;
            font-size: 0.85rem;
            font-weight: 500;
            flex: 1;
            position: relative;
            z-index: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .announcement-bar .announce-text strong {
            color: #ffd966;
        }

        /* ============================================================
           FEATURE BADGES - UPGRADED PREMIUM
           ============================================================ */
        .feature-badges {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.6rem;
            animation: fadeUp 0.8s ease 0.15s both;
        }

        .feature-badge {
            background: rgba(15, 26, 43, 0.45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 60px;
            padding: 0.5rem 0.3rem;
            border: 1px solid rgba(0, 200, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            font-size: 0.6rem;
            font-weight: 700;
            color: #b3e4ff;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            min-height: 38px;
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
        }
        .feature-badge::before {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.4s;
            border-radius: 60px;
        }
        .feature-badge:hover {
            transform: translateY(-3px) scale(1.02);
            border-color: rgba(0, 200, 255, 0.25);
            box-shadow: 0 0 40px rgba(0, 200, 255, 0.06);
        }
        .feature-badge i {
            font-size: 0.75rem;
        }
        .feature-badge .shield { color: #4ade80; }
        .feature-badge .ban { color: #f87171; }
        .feature-badge .update { color: #60a5fa; }
        .feature-badge .price {
            color: #fbbf24;
            font-weight: 800;
            font-size: 0.7rem;
        }

        .feature-badge.glow-blue {
            border-color: rgba(0, 200, 255, 0.08);
        }
        .feature-badge.glow-blue:hover {
            border-color: rgba(0, 200, 255, 0.30);
            box-shadow: 0 0 40px rgba(0, 200, 255, 0.08);
        }
        .feature-badge.glow-green {
            border-color: rgba(74, 222, 128, 0.08);
        }
        .feature-badge.glow-green:hover {
            border-color: rgba(74, 222, 128, 0.30);
            box-shadow: 0 0 40px rgba(74, 222, 128, 0.08);
        }
        .feature-badge.glow-gold {
            border-color: rgba(251, 191, 36, 0.08);
        }
        .feature-badge.glow-gold:hover {
            border-color: rgba(251, 191, 36, 0.30);
            box-shadow: 0 0 40px rgba(251, 191, 36, 0.08);
        }

        /* ============================================================
           LOGIN CARD - UPGRADED GLASSMORPHISM
           ============================================================ */
        .login-card {
            background: rgba(15, 26, 43, 0.45);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 2.8rem 2.8rem 2.2rem;
            border-radius: 2.5rem;
            border: 1px solid rgba(0, 102, 170, 0.08);
            box-shadow: 
                0 30px 80px rgba(0, 0, 0, 0.5),
                0 0 60px rgba(0, 50, 100, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.02);
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: fadeUp 0.8s ease 0.3s both;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(0, 200, 255, 0.015), transparent, rgba(100, 0, 255, 0.015), transparent);
            animation: rotateGlow 25s linear infinite;
            pointer-events: none;
        }
        @keyframes rotateGlow {
            to { transform: rotate(360deg); }
        }

        .login-card>* { position: relative; z-index: 1; }

        /* ===== BRANDING - UPGRADED ===== */
        .brand-icon {
            font-size: 3.8rem;
            color: #00ccff;
            margin-bottom: 0.2rem;
            filter: drop-shadow(0 0 40px rgba(0, 204, 255, 0.15));
            animation: brandPulse 3s ease-in-out infinite;
            display: inline-block;
        }
        @keyframes brandPulse {
            0%, 100% { filter: drop-shadow(0 0 30px rgba(0, 204, 255, 0.12)); }
            50% { filter: drop-shadow(0 0 60px rgba(0, 204, 255, 0.25)); }
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.4rem;
            font-weight: 900;
            background: linear-gradient(145deg, #a0f0ff, #00d4ff, #7b2ffc);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 4px;
            animation: gradientShift 4s ease-in-out infinite;
            text-shadow: 0 0 60px rgba(0, 180, 255, 0.08);
        }
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .brand-sub {
            color: #6a8fa8;
            font-size: 0.75rem;
            margin-bottom: 1.8rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-weight: 300;
        }

        /* ===== INPUT FIELDS - UPGRADED ===== */
        .input-group {
            position: relative;
            margin-bottom: 1.2rem;
        }
        .input-group i {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: #3a6a8a;
            font-size: 0.95rem;
            transition: 0.4s;
            z-index: 2;
        }
        .input-group input {
            width: 100%;
            padding: 0.85rem 1.2rem 0.85rem 3.2rem;
            background: rgba(1, 10, 20, 0.5);
            border: 1px solid rgba(31, 74, 107, 0.20);
            border-radius: 60px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.4s;
            font-family: 'Exo 2', sans-serif;
        }
        .input-group input:focus {
            border-color: rgba(0, 166, 255, 0.35);
            box-shadow: 0 0 40px rgba(0, 119, 255, 0.06);
            background: rgba(1, 10, 20, 0.7);
        }
        .input-group input:focus+i {
            color: #00ccff;
        }
        .input-group input::placeholder {
            color: #3a5a7a;
        }

        .input-group .toggle-pass {
            position: absolute;
            right: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: #3a6a8a;
            cursor: pointer;
            font-size: 0.95rem;
            transition: 0.3s;
            z-index: 2;
            background: transparent;
            border: none;
            padding: 0.3rem;
        }
        .input-group .toggle-pass:hover {
            color: #00ccff;
        }

        /* ===== LOGIN BUTTON - UPGRADED ===== */
        .login-btn {
            background: linear-gradient(145deg, #005f9e, #0077cc);
            border: none;
            padding: 0.9rem;
            border-radius: 60px;
            font-weight: 700;
            color: white;
            cursor: pointer;
            font-size: 1.05rem;
            width: 100%;
            border: 1px solid rgba(0, 136, 208, 0.20);
            box-shadow: 0 0 40px rgba(0, 76, 128, 0.12);
            transition: all 0.4s;
            letter-spacing: 3px;
            font-family: 'Exo 2', sans-serif;
            position: relative;
            overflow: hidden;
        }
        .login-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.03), transparent);
            transform: rotate(45deg);
            transition: 0.6s;
        }
        .login-btn:hover::before {
            left: 100%;
        }
        .login-btn:hover {
            background: linear-gradient(145deg, #0077cc, #0099ee);
            transform: scale(1.02);
            box-shadow: 0 0 60px rgba(0, 102, 204, 0.20);
            border-color: rgba(0, 150, 255, 0.30);
        }
        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .login-btn i {
            margin-right: 0.5rem;
        }

        .error-msg {
            color: #ff6b6b;
            margin-top: 0.8rem;
            font-weight: 500;
            min-height: 1.5rem;
            font-size: 0.85rem;
        }
        .success-msg {
            color: #4ade80;
            margin-top: 0.8rem;
            font-weight: 500;
            min-height: 1.5rem;
            font-size: 0.85rem;
        }

        .loader-ring {
            display: inline-block;
            width: 28px;
            height: 28px;
            margin: 0.3rem auto;
            border: 3px solid rgba(26, 56, 80, 0.3);
            border-top: 3px solid #00ccff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== DIVIDER ===== */
        .login-divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.2rem 0 0.8rem;
            color: #2a4a6a;
            font-size: 0.7rem;
            letter-spacing: 2px;
        }
        .login-divider::before,
        .login-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(31, 74, 107, 0.20), transparent);
        }

        /* ===== BOTTOM TEXTS - UPGRADED ===== */
        .footer-text {
            color: #3a6a8a;
            font-size: 0.7rem;
            opacity: 0.7;
            letter-spacing: 1px;
        }
        .footer-text i {
            color: #00ccff;
        }
        .footer-text a {
            color: #25d366;
            text-decoration: none;
            transition: 0.3s;
        }
        .footer-text a:hover {
            color: #4ade80;
        }

        /* ============================================================
           ANIMATIONS
           ============================================================ */
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 700px) {
            body { padding: 1rem; }
            .login-card { padding: 1.8rem 1.4rem; }
            .feature-badges { grid-template-columns: repeat(2, 1fr); gap: 0.5rem; }
            .feature-badge { font-size: 0.55rem; padding: 0.4rem 0.3rem; min-height: 34px; }
            .brand-icon { font-size: 3rem; }
            .brand-title { font-size: 1.8rem; }
            .announcement-bar .announce-text { font-size: 0.75rem; white-space: normal; }
            .announcement-bar { padding: 0.6rem 1rem; flex-wrap: wrap; }
            .energy-orb { display: none; }
            .light-streak { display: none; }
            .grid-lines { background-size: 30px 30px; }
            .login-wrapper { max-width: 100%; }
        }
        @media (max-width: 480px) {
            .login-card { padding: 1.4rem 1rem; }
            .feature-badges { grid-template-columns: 1fr 1fr; gap: 0.4rem; }
            .feature-badge { font-size: 0.5rem; padding: 0.3rem 0.2rem; min-height: 30px; }
            .feature-badge i { font-size: 0.65rem; }
            .brand-icon { font-size: 2.5rem; }
            .brand-title { font-size: 1.5rem; }
            .brand-sub { font-size: 0.65rem; letter-spacing: 3px; }
            .login-btn { font-size: 0.9rem; padding: 0.75rem; }
            .input-group input { font-size: 0.85rem; padding: 0.7rem 1rem 0.7rem 2.8rem; }
        }
    </style>
</head>
<body>

    <!-- ===== PREMIUM BACKGROUND ===== -->
    <div id="bg-layer">
        <div class="bg-deep-space"></div>
        <div class="grid-lines"></div>
        <div class="energy-orb orb-1"></div>
        <div class="energy-orb orb-2"></div>
        <div class="energy-orb orb-3"></div>
        <div class="light-streak-container">
            <div class="light-streak"></div>
            <div class="light-streak"></div>
            <div class="light-streak"></div>
            <div class="light-streak"></div>
            <div class="light-streak"></div>
        </div>
        <canvas id="particles-canvas"></canvas>
        <div class="glass-atmosphere"></div>
        <div class="vignette"></div>
    </div>

    <!-- ===== LOGIN CONTENT ===== -->
    <div class="login-wrapper">

        <!-- Announcement Bar -->
        <div class="announcement-bar">
            <span class="live-badge">● LIVE</span>
            <i class="fas fa-bullhorn announce-icon"></i>
            <div class="announce-text" id="loginAnnounceText">
                <strong>📢</strong> Loading announcements...
            </div>
        </div>

        <!-- Feature Badges -->
        <div class="feature-badges">
            <div class="feature-badge glow-green">
                <i class="fas fa-shield-alt shield"></i> Fully Safe
            </div>
            <div class="feature-badge glow-blue">
                <i class="fas fa-ban ban"></i> AntiBan
            </div>
            <div class="feature-badge glow-blue">
                <i class="fas fa-sync-alt update"></i> Daily Updates
            </div>
            <div class="feature-badge glow-gold">
                <i class="fas fa-tag price"></i> <span class="price">2000 PKR</span>
            </div>
        </div>

        <!-- Login Card -->
        <div class="login-card">
            <div class="brand-icon"><i class="fas fa-crown"></i></div>
            <div class="brand-title">ABID SIR</div>
            <div class="brand-sub">⚡ Premium Gaming Vault ⚡</div>

            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="emailInput" placeholder="Email address" autocomplete="email">
            </div>

            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="passInput" placeholder="Password" autocomplete="current-password">
                <button class="toggle-pass" id="togglePass" type="button">
                    <i class="fas fa-eye" id="eyeIcon"></i>
                </button>
            </div>

    <script>
        // ============================================================
        // PARTICLES BACKGROUND
        // ============================================================
        (function initParticles() {
            const canvas = document.getElementById('particles-canvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            let w, h;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Particle {
                constructor() {
                    this.x = Math.random() * w;
                    this.y = Math.random() * h;
                    this.size = Math.random() * 2 + 0.5;
                    this.speedX = (Math.random() - 0.5) * 0.3;
                    this.speedY = (Math.random() - 0.5) * 0.3;
                    this.opacity = Math.random() * 0.4 + 0.05;
                    this.hue = 190 + Math.random() * 40;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.x < 0 || this.x > w) this.speedX *= -1;
                    if (this.y < 0 || this.y > h) this.speedY *= -1;
                    this.opacity += (Math.random() - 0.5) * 0.005;
                    this.opacity = Math.max(0.03, Math.min(0.5, this.opacity));
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${this.hue}, 80%, 60%, ${this.opacity * 0.5})`;
                    ctx.fill();
                }
            }

            for (let i = 0; i < 60; i++) {
                particles.push(new Particle());
            }

            function animate() {
                ctx.clearRect(0, 0, w, h);
                particles.forEach(p => { p.update(); p.draw(); });
                
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 100) {
                            ctx.beginPath();
                            ctx.strokeStyle = `rgba(0, 200, 255, ${0.03 * (1 - dist / 100)})`;
                            ctx.lineWidth = 0.3;
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(animate);
            }
            animate();
        })();
